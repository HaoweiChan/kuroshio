[project]
name = "kuroshio"
version = "0.0.1"
description = "Open-source quantamental portfolio engine — daily portfolio health checks, momentum screening, and IPS-driven rebalancing proposals"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.40"]
finmind = ["requests>=2.31"]
dev = ["pytest>=8.0"]

[project.scripts]
kuroshio = "kuroshio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuroshio"]
