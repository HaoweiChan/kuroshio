[project]
name = "kuroshio"
version = "0.0.1"
description = "Open-source quantamental portfolio engine — daily portfolio health checks, momentum screening, and IPS-driven rebalancing proposals"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.40"]
finmind = ["requests>=2.31"]
dev = ["pytest>=8.0", "ruff>=0.4"]
# kuroshio.agents.engine — componentized TradingAgents LLM pipeline.
# Data-vendor deps (yfinance, finmind) are separate extras; combine as needed,
# e.g. pip install "kuroshio[agents,yfinance]".
agents = [
    "langchain-core>=0.3.81",
    "langchain-anthropic>=0.3.15",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.0",
    "requests>=2.32.4",
    "stockstats>=0.6.5",
    "parsel>=1.10.0",
    "python-dateutil>=2.8",
    "typing-extensions>=4.14.0",
]

[project.scripts]
kuroshio = "kuroshio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuroshio"]

[tool.ruff]
target-version = "py311"
line-length = 110
# kuroshio/agents/engine is vendored (componentized TradingAgents pipeline) —
# never reformat it, so future upstream diffs stay readable.
exclude = ["kuroshio/agents/engine"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
